services:
  - type: web
    name: fanfic-atlas-fastapi
    runtime: python
    plan: free
    rootDir: fastapi_app
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: CORS_ALLOW_ORIGINS
        value: "*"
      - key: FANFIC_DB_PATH
        value: /tmp/fanfic.db
