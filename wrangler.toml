name = "fanfic-atlas-proxy"
main = "workers/proxy-worker.js"
compatibility_date = "2026-08-22"
workers_dev = true

# Set the deployed FastAPI origin in this file or with the Cloudflare Dashboard.
# This Worker only forwards /api/search and /api/reader; it never runs
# platform scrapers in the Cloudflare edge runtime.
[vars]
API_ORIGIN = ""
