name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify FastAPI, PWA, and Tauri
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: fastapi_app/requirements.txt

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fastapi_app/requirements.txt

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run FastAPI tests
        run: python -m pytest -q fastapi_app

      - name: Run frontend and Worker tests
        run: pnpm test

      - name: Build production web bundle
        run: pnpm build

      - name: Check Tauri Rust project
        working-directory: src-tauri
        run: cargo check
