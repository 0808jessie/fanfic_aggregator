name: Release Desktop App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-14
            target_triple: aarch64-apple-darwin
            binary_name: api-server-aarch64-apple-darwin
          - platform: macos-13
            target_triple: x86_64-apple-darwin
            binary_name: api-server-x86_64-apple-darwin
          - platform: windows-latest
            target_triple: x86_64-pc-windows-msvc
            binary_name: api-server-x86_64-pc-windows-msvc.exe

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target_triple }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python & PyInstaller Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r fastapi_app/requirements.txt

      - name: Build Python Sidecar with PyInstaller
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --name "api-server" --paths "fastapi_app" --collect-all curl_cffi fastapi_app/entrypoint.py
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" == "Windows" ]; then
            cp dist/api-server.exe src-tauri/binaries/${{ matrix.binary_name }}
          else
            cp dist/api-server src-tauri/binaries/${{ matrix.binary_name }}
            chmod +x src-tauri/binaries/${{ matrix.binary_name }}
          fi
          ls -la src-tauri/binaries/

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fanfic Atlas v__VERSION__"
          releaseBody: "自動編譯發布的內測版本 (含 Python FastAPI Sidecar 自動生命週期管理)。請參考 TESTING_GUIDE.md 安裝與使用。"
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target_triple }}
