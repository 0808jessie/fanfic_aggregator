name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller uvicorn fastapi curl_cffi beautifulsoup4 httpx pydantic
          if [ -f fastapi_app/requirements.txt ]; then
            pip install -r fastapi_app/requirements.txt
          fi

      - name: Build Python FastAPI Sidecar with PyInstaller
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          pyinstaller --noconfirm --onefile --name "api-server" \
            --paths "fastapi_app" \
            fastapi_app/entrypoint.py
          
          if [ -f "dist/api-server" ]; then
            cp "dist/api-server" "src-tauri/binaries/api-server-${{ matrix.target }}"
          elif [ -f "dist/api-server.exe" ]; then
            cp "dist/api-server.exe" "src-tauri/binaries/api-server-${{ matrix.target }}.exe"
          fi
          echo "Built sidecar binary for ${{ matrix.target }}:"
          ls -lh src-tauri/binaries/

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0.5.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Fanfic Atlas v__VERSION__'
          releaseBody: '自動編譯發布的內測版本（含自動背景啟動 FastAPI Sidecar）。請參考 TESTING_GUIDE.md 安裝與使用。'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
