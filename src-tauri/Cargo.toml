[package]
name = "fanfic_atlas"
version = "1.0.0"
description = "Cross-platform fanfiction aggregator desktop app"
authors = ["Jessie <0808jessie@github.com>"]
edition = "2021"

[lib]
name = "fanfic_atlas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
